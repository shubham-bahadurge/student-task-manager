<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Task Manager</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <div class="container">

        <h1>📚 Student Task Manager</h1>

        <p class="subtitle">
            Organize your subjects, tasks, and deadlines in one place.
        </p>


        <!-- Add Task Section -->

        <div class="input-section">

            <input
                type="text"
                id="subject"
                placeholder="Enter subject"
            >

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task"
            >

            <input
                type="date"
                id="deadline"
            >

            <button onclick="addTask()">
                ➕ Add Task
            </button>

        </div>


        <!-- Counters -->

        <div class="counters">

            <h3 id="taskCount">
                Total Tasks: 0
            </h3>

            <h3 id="completedCount">
                Completed: 0
            </h3>

        </div>


        <!-- Search and Filter -->

        <div class="filter-section">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search tasks..."
                oninput="filterTasks()"
            >

            <select
                id="statusFilter"
                onchange="filterTasks()"
            >

                <option value="all">
                    📋 All Tasks
                </option>

                <option value="pending">
                    ⏳ Pending
                </option>

                <option value="completed">
                    ✅ Completed
                </option>

            </select>

        </div>


        <!-- Task List -->

        <div id="taskList"></div>


        <!-- Clear All -->

        <button
            class="clear-button"
            onclick="clearTasks()"
        >
            🗑️ Clear All Tasks
        </button>

    </div>


    <script
        src="{{ url_for('static', filename='script.js') }}"
    ></script>

</body>

</html>
